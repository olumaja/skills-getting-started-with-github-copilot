<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Simple, clean styling to make cards pretty */
      :root {
        --bg: #f6f7fb;
        --card: #ffffff;
        --muted: #6b7280;
        --accent: #4f46e5;
        --accent-2: #7c3aed;
        --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        --radius: 12px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: linear-gradient(180deg, var(--bg), #eef2ff);
        color: #0f172a;
      }
      .wrap {
        max-width: 1100px;
        margin: 36px auto;
        padding: 24px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      p.lead {
        margin: 4px 0 0;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 18px;
      }
      .card {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card h2 {
        margin: 0;
        font-size: 16px;
        color: #0b1220;
      }
      .meta {
        color: var(--muted);
        font-size: 13px;
      }
      .desc {
        color: #111827;
        font-size: 14px;
      }
      .participants {
        background: linear-gradient(90deg, rgba(127, 90, 240, 0.06), rgba(79, 70, 229, 0.03));
        padding: 10px;
        border-radius: 10px;
      }
      .participants h3 {
        margin: 0 0 6px 0;
        font-size: 13px;
        color: #312e81;
      }
      ul.part-list {
        margin: 0;
        padding-left: 18px;
        color: #0f172a;
      }
      ul.part-list li {
        margin: 4px 0;
        font-size: 13px;
      }
      .empty {
        color: var(--muted);
        font-size: 13px;
      }
      .signup {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 6px;
      }
      .signup input[type="email"] {
        flex: 1;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #e6e9ef;
      }
      .btn {
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        color: white;
        padding: 8px 12px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
      }
      .btn[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
      }
      footer {
        margin-top: 18px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }
      .pill {
        font-size: 12px;
        color: #fff;
        background: #111827;
        padding: 6px 10px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Mergington High — Activities</h1>
          <p class="lead">Browse extracurricular activities and see who is already signed up.</p>
        </div>
        <div class="pill">Extracurriculars</div>
      </header>

      <main>
        <div id="loading" class="meta">Loading activities…</div>
        <div id="grid" class="grid" style="display:none"></div>
      </main>

      <footer>Signup updates are immediate but stored in-memory on the server.</footer>
    </div>

    <script>
      async function fetchActivities() {
        const res = await fetch('/activities');
        if (!res.ok) throw new Error('Failed to load activities');
        return await res.json();
      }

      function createCard(name, data) {
        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <div>
            <h2>${escapeHtml(name)}</h2>
            <div class="meta">${escapeHtml(data.schedule)}</div>
          </div>
          <div class="desc">${escapeHtml(data.description)}</div>
          <div class="participants">
            <h3>Participants</h3>
            <div class="list-wrap"></div>
            <div class="signup">
              <input aria-label="email" type="email" placeholder="you@school.edu" />
              <button class="btn">Sign up</button>
            </div>
          </div>
        `;

        const listWrap = card.querySelector('.list-wrap');
        const input = card.querySelector('input[type="email"]');
        const btn = card.querySelector('.btn');

        function renderList() {
          listWrap.innerHTML = '';
          const participants = Array.isArray(data.participants) ? data.participants : [];
          if (participants.length === 0) {
            const p = document.createElement('div');
            p.className = 'empty';
            p.textContent = 'No participants yet — be the first!';
            listWrap.appendChild(p);
          } else {
            const ul = document.createElement('ul');
            ul.className = 'part-list';
            participants.forEach(email => {
              const li = document.createElement('li');
              li.textContent = email;
              ul.appendChild(li);
            });
            listWrap.appendChild(ul);
          }
        }

        async function signup() {
          const email = input.value.trim();
          if (!email) return alert('Please enter an email');
          btn.disabled = true;
          try {
            const url = `/activities/${encodeURIComponent(name)}/signup?email=${encodeURIComponent(email)}`;
            const res = await fetch(url, { method: 'POST' });
            if (!res.ok) {
              const err = await res.json().catch(() => ({ detail: 'Signup failed' }));
              throw new Error(err.detail || 'Signup failed');
            }
            // update local data and re-render
            data.participants = data.participants || [];
            data.participants.push(email);
            renderList();
            input.value = '';
          } catch (e) {
            alert(e.message || 'Unable to sign up');
          } finally {
            btn.disabled = false;
          }
        }

        btn.addEventListener('click', signup);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') signup(); });

        renderList();
        return card;
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (m) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
      }

      (async function init() {
        try {
          const activities = await fetchActivities();
          const grid = document.getElementById('grid');
          const loading = document.getElementById('loading');
          loading.style.display = 'none';
          grid.style.display = 'grid';

          // activities is an object keyed by name
          Object.keys(activities).sort().forEach(name => {
            const card = createCard(name, activities[name]);
            grid.appendChild(card);
          });

        } catch (e) {
          const loading = document.getElementById('loading');
          loading.textContent = 'Could not load activities.';
          console.error(e);
        }
      })();
    </script>
  </body>
</html>
